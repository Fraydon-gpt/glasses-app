name: Build the app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Put the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyGlasses.apk
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest MyGlasses.apk --repo "${{ github.repository }}" \
            --title "My Glasses (build ${{ github.run_number }})" \
            --notes "On your Pixel, tap MyGlasses.apk to download it, then open it and tap Install."

      - name: Save the build log for Claude
        if: always()
        shell: bash
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --quiet . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit --quiet -m "Build log ${{ github.run_number }} (${{ job.status }})"
          git push --force origin ci-log
